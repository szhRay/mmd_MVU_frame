<div class="mvu-manager-root">
  <button class="mvu-manager-launcher" type="button">变量管理</button>
  <section class="mvu-manager" hidden>
    <header><strong>变量管理</strong><button class="mvu-manager-close" type="button">×</button></header>
    <div class="mvu-status"></div>
    <div class="mvu-notice"></div>
    <div class="mvu-tabs"><button class="mvu-tab-variables" type="button">变量</button><button class="mvu-tab-preview" type="button">变量注入预览</button></div>
    <div class="mvu-variable-page"><button class="mvu-reset" type="button">重置当前轮</button><fieldset class="mvu-tree"></fieldset></div>
    <section class="mvu-injection-preview" hidden><p>MVU 将在发送正文末尾追加以下变量块</p><button class="mvu-recalculate" type="button">重新计算</button><p class="mvu-preview-status"></p><pre class="mvu-preview-text"></pre></section>
  </section>
</div>
